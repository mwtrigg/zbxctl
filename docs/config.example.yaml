current_context: prod

contexts:
  prod:
    url: https://zabbix.example.com
    api_token: ""
    username: Admin
    password: ""
    tls_verify: true
    ca_file: ""
    proxy: ""
    default_limit: 100
    api_version: ""         # pin the Zabbix version, e.g. "7.4" or "8.0"; empty = detect (7.4 and newer)
    permissions: write      # readonly | operator | write (default write)
    allowed_scripts: []     # `run script` entries: name@sha256:<hash of the script's command>; empty = blocked
    # api_call_admin: false # true lets `api call` write user, token, script, action, role... objects
    before_state: true      # save a before-state file for bulk writes under --apply (default true)
    state_dir: ""           # where they go; empty = ~/.local/state/zbxctl
    state_keep: 200         # keep this many, delete older ones as new are written; 0 = keep all

  staging:
    url: https://zabbix-staging.example.com
    api_token: ""
    username: Admin
    password: ""
    tls_verify: true
    default_limit: 100
