current_context: prod

contexts:
  prod:
    url: https://zabbix.example.com
    api_token: ""
    username: Admin
    password: ""
    tls_verify: true
    ca_file: ""
    proxy: ""
    default_limit: 100
    permissions: write      # readonly | operator | write (default write)
    allowed_scripts: []     # names or IDs `run script` may execute; empty = blocked

  staging:
    url: https://zabbix-staging.example.com
    api_token: ""
    username: Admin
    password: ""
    tls_verify: true
    default_limit: 100
