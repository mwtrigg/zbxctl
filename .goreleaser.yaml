# GoReleaser configuration: `goreleaser release --clean` on a pushed v* tag builds the
# archives, checksums and SBOMs. Archive names carry the version
# (zbxctl_<version>_<os>_<arch>) because the signed checksums.txt must bind each
# archive to its version; `zbxctl upgrade` looks them up by that name. Change them
# only together with internal/cli/upgrade_install.go.
version: 2
project_name: zbxctl

builds:
  - id: zbxctl
    main: ./cmd/zbxctl
    binary: zbxctl
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/mwtrigg/zbxctl/internal/version.Version={{ .Version }}

archives:
  - id: zbxctl
    name_template: "zbxctl_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # The license and the third-party notices travel with every binary.
    files:
      - LICENSE
      - THIRD_PARTY_NOTICES.md
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

# checksums.txt is signed with an ed25519 SSH key: `zbxctl upgrade` verifies
# checksums.txt.sig against the public key compiled into the binary
# (internal/cli/release_keys.go). The key file path comes from the environment;
# the release workflow writes the ZBXCTL_SIGNING_KEY secret there.
signs:
  - id: checksums
    artifacts: checksum
    cmd: ssh-keygen
    args:
      - -Y
      - sign
      - -f
      - "{{ .Env.ZBXCTL_SIGNING_KEY_FILE }}"
      - -n
      - zbxctl-release
      - "${artifact}"
    signature: "${artifact}.sig"

# A software bill of materials (SPDX) for each archive; needs syft on PATH.
sboms:
  - id: archive-sboms
    artifacts: archive

# The release notes come from CHANGELOG.md (scripts/release-notes.sh, passed with
# --release-notes), never from commit subjects, which can name internal things.
changelog:
  disable: true

release:
  prerelease: auto
