name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # lets CI be started by hand from the Actions tab

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"   # the newest 1.26.x patch (1.25 is out of support): releases and CI carry the stdlib fixes
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Cross-compile every release platform
        run: |
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -o /dev/null ./cmd/zbxctl
            done
          done
      - name: The release notes can be produced
        run: scripts/release-notes.sh v0.1.0 > /dev/null
      - name: go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: THIRD_PARTY_NOTICES.md is up to date
        run: go run scripts/notices/main.go | diff -u THIRD_PARTY_NOTICES.md -

  vulnerabilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"   # the newest 1.26.x patch (1.25 is out of support): releases and CI carry the stdlib fixes
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
